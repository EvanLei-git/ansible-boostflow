- name: Setup React project environment
  hosts: all
  become: yes
  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Node.js and npm
      apt:
        name:
          - nodejs
          - npm
        state: present

    - name: Ensure n is installed (Node.js version manager)
      npm:
        name: n
        global: yes

    - name: Upgrade Node.js to latest LTS version
      command: n lts
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin"

    - name: Clone your React project from Git repository
      git:
        repo: 'https://github.com/KDim67/BoostFlow.git'
        dest: "{{ app_dir }}"
        version: main
      become: false

    - name: Install React project dependencies
      npm:
        path: "{{ app_dir }}"
        state: present
      become: false

    - name: Build React app (optional)
      command: npm run build
      args:
        chdir: "{{ app_dir }}"
      become: false

