---
- name: Deploy Next.js Application
  hosts: azure_hosts
  become: no
  vars_files:
    - ../../group_vars/vault.yaml
  tasks:
    - name: Ensure Boostflow directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      become: yes

    - name: Ensure SSH directory exists
      file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'
      become: yes

    - name: Copy SSH private key to remote host
      copy:
        src: "{{ github_ssh_key_path }}"
        dest: "/home/{{ ansible_user }}/.ssh/id_rsa"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      become: yes

    - name: Copy SSH public key to remote host
      copy:
        src: "{{ github_ssh_public_key_path }}"
        dest: "/home/{{ ansible_user }}/.ssh/id_rsa.pub"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      become: yes

    - name: Add GitHub to known_hosts
      known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan -H github.com') }}"
        path: "/home/{{ ansible_user }}/.ssh/known_hosts"
      become_user: "{{ ansible_user }}"
      become: yes

    - name: Clone Boostflow repository
      git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
        key_file: "/home/{{ ansible_user }}/.ssh/id_rsa"
        accept_hostkey: yes
      become_user: "{{ ansible_user }}"
      become: yes

    - name: Copy .env.local file to application directory
      copy:
        src: ../../../.env.local
        dest: "/home/{{ ansible_user }}/{{ app_name }}/.env.local"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      become: yes

    - name: Check if package.json exists
      stat:
        path: "{{ app_dir }}/package.json"
      register: package_json

    - name: Clean npm cache and remove node_modules
      shell: |
        npm cache clean --force || true
        rm -rf node_modules package-lock.json || true
      args:
        chdir: "{{ app_dir }}"
      when: package_json.stat.exists
      become: false
      ignore_errors: yes

    # Removed Docker service stopping as it conflicts with Docker deployment

    - name: Install Next.js project dependencies
      shell: |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund --prefer-offline --silent --progress=false
        else
          npm install --no-audit --no-fund --prefer-offline --force --silent --progress=false
        fi
      args:
        chdir: "{{ app_dir }}"
      environment:
        NODE_OPTIONS: "--max-old-space-size=2048"
        NPM_CONFIG_PROGRESS: "false"
        NPM_CONFIG_LOGLEVEL: "error"
      register: install_result
      failed_when: install_result.rc != 0

    # Removed Docker service restart as it's handled by installation playbooks

    - name: Kill any existing Node.js processes
      shell: |
        # Kill processes on ports 3000 and 3001
        lsof -ti:3000 | xargs -r kill -9 || true
        lsof -ti:3001 | xargs -r kill -9 || true
        # Kill node processes using ps and grep
        ps aux | grep -E '(node|npm|next)' | grep -v grep | awk '{print $2}' | xargs -r kill -9 || true
        # Wait for processes to terminate
        sleep 3
      ignore_errors: yes
      become: yes

    - name: Build Next.js application
      shell: |
        export NODE_OPTIONS="--max-old-space-size=2048"
        timeout 20 npm run build
      args:
        chdir: "{{ app_dir }}"
      when: package_json.stat.exists
      become: false
      register: build_result
      failed_when: build_result.rc != 0 and build_result.rc != 124
      ignore_errors: yes

    - name: Verify deployment
      command: node -v
      register: node_version

    - name: Deploy Next.js systemd service
      template:
        src: ../../templates/nextjs.service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        owner: root
        group: root
        mode: '0644'
      become: yes
      notify: restart nextjs

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      become: yes

    - name: Enable and start Next.js service
      systemd:
        name: "{{ app_name }}.service"
        enabled: yes
        state: started
      become: yes

    - name: Wait for Next.js service to be ready
      wait_for:
        port: "{{ app_port }}"
        host: localhost
        delay: 5
        timeout: 60

    - name: Display deployment status
      debug:
        msg: "Node.js deployment completed. Version: {{ node_version.stdout }}. Service: {{ app_name }} is running on port {{ app_port }}"

  handlers:
    - name: restart nextjs
      systemd:
        name: "{{ app_name }}.service"
        state: restarted
      become: yes