---
# Selective deployment playbook - Only NextJS App (no MinIO)
# This playbook only targets vag-prod-vm for faster deployments

- name: Deploy NextJS Application Only
  hosts: vag-prod-vm  # Only target the production VM with NGINX
  become: no
  vars:
    branch: "{{ branch | default('main') }}"
    build_tag: "{{ build_tag | default('latest') }}"
  tasks:
    - name: Ensure Boostflow directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      become: yes

    - name: Ensure SSH directory exists
      file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'
      become: yes

    - name: Copy SSH private key to remote host
      copy:
        src: "{{ ssh_key_path }}"
        dest: "/home/{{ ansible_user }}/.ssh/id_rsa"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      become: yes

    - name: Add GitHub to known_hosts
      known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan -H github.com') }}"
        path: "/home/{{ ansible_user }}/.ssh/known_hosts"
      become_user: "{{ ansible_user }}"
      become: yes

    - name: Clone/Update Boostflow repository
      git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
        key_file: "/home/{{ ansible_user }}/.ssh/id_rsa"
        accept_hostkey: yes
      become_user: "{{ ansible_user }}"
      become: yes

    - name: Copy .env.local file to application directory
      copy:
        src: "{{ env_file_source }}"
        dest: "{{ env_file_dest }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      become: yes

    - name: Copy NextJS-specific docker-compose file
      copy:
        src: "{{ app_dir }}/docker-compose.nextjs.yaml"
        dest: "{{ app_dir }}/docker-compose.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
        remote_src: yes
      become: yes

    - name: Stop existing NextJS application
      shell: docker compose down || true
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes
      become: yes

    - name: Build and start NextJS application only
      shell: docker compose up -d --build nextjs
      args:
        chdir: "{{ app_dir }}"
      become: yes

    - name: Wait for NextJS application to be ready
      wait_for:
        port: "{{ app_port }}"
        host: localhost
        delay: 10
        timeout: 60

    - name: Show NextJS container status
      shell: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      register: nextjs_status
      become: yes

    - name: Display NextJS status
      debug:
        var: nextjs_status.stdout_lines

# Deploy Nginx Configuration for NextJS (only if needed)
- name: Update Nginx Configuration
  hosts: vag-prod-vm
  become: yes
  tasks:
    - name: Ensure Nginx is running
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      ignore_errors: yes

    - name: Reload Nginx if configuration is valid
      systemd:
        name: nginx
        state: reloaded
      when: nginx_test.rc == 0

    - name: Display deployment completion
      debug:
        msg: "NextJS application deployed successfully on {{ ansible_host }}. MinIO on vag-minio-vm was not affected."