---
- name: Deploy Docker Services
  hosts: azure_hosts
  become: no
  vars_files:
    - ../../group_vars/vault.yaml
  tasks:
    - name: Ensure Boostflow directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      become: yes

    - name: Ensure SSH directory exists
      file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'
      become: yes

    - name: Copy SSH private key to remote host
      copy:
        src: "{{ github_ssh_key_path }}"
        dest: "/home/{{ ansible_user }}/.ssh/id_rsa"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      become: yes

    - name: Copy SSH public key to remote host
      copy:
        src: "{{ github_ssh_public_key_path }}"
        dest: "/home/{{ ansible_user }}/.ssh/id_rsa.pub"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      become: yes

    - name: Add GitHub to known_hosts
      known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan -H github.com') }}"
        path: "/home/{{ ansible_user }}/.ssh/known_hosts"
      become_user: "{{ ansible_user }}"
      become: yes

    - name: Clone Boostflow repository
      git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
        key_file: "/home/{{ ansible_user }}/.ssh/id_rsa"
        accept_hostkey: yes
      become_user: "{{ ansible_user }}"
      become: yes

    - name: Copy .env.local file to application directory
      copy:
        src: ../../../.env.local
        dest: "/home/{{ ansible_user }}/{{ app_name }}/.env.local"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      become: yes

    - name: Stop existing Docker Compose services
      shell: docker compose down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes
      become: yes

    - name: Start Docker Compose services
      shell: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      become: yes
      when: docker_action | default('start') == 'start'

    - name: Show running containers
      shell: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      register: docker_status
      become: yes
      when: docker_action | default('start') == 'start'

    - name: Display Docker status
      debug:
        var: docker_status.stdout_lines
      when: docker_action | default('start') == 'start' and docker_status is defined