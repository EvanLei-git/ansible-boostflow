---
# Jenkins-only deployment playbook for VM1 (vag-setup-vm)
# This playbook only targets vag-setup-vm for Jenkins deployment with Nginx

- name: Configure Nginx for Jenkins
  hosts: vag-setup-vm
  become: yes
  vars:
    domain_name: jenkins.boostflow.me
    jenkins_port: 8080
    nginx_port: 80
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Install Certbot and Nginx plugin
      apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Ensure Nginx is running
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

    - name: Install Jenkins
      include_tasks: ../tasks/install_jenkins.yaml

    - name: Create temporary HTTP-only Nginx configuration for Jenkins
      copy:
        content: |
          server {
              listen 80;
              server_name {{ domain_name }};
              
              location / {
                  proxy_pass http://localhost:{{ jenkins_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
                  proxy_read_timeout 86400;
                  
                  # Jenkins specific headers
                  proxy_set_header X-Forwarded-Port $server_port;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Server $host;
                  proxy_buffering off;
                  client_max_body_size 100M;
              }
          }
        dest: "/etc/nginx/sites-available/{{ domain_name }}"
        backup: yes
      notify: restart nginx

    - name: Enable Jenkins site (HTTP only)
      file:
        src: "/etc/nginx/sites-available/{{ domain_name }}"
        dest: "/etc/nginx/sites-enabled/{{ domain_name }}"
        state: link
      notify: restart nginx

    - name: Restart Nginx before SSL certificate
      systemd:
        name: nginx
        state: restarted
        
    - name: Configure firewall for web traffic
      block:
        - name: Allow SSH (port 22) - IMPORTANT
          ufw:
            rule: allow
            port: '22'
            proto: tcp

        - name: Allow HTTP (port 80) for Let's Encrypt
          ufw:
            rule: allow
            port: '80'
            proto: tcp

        - name: Allow HTTPS (port 443)
          ufw:
            rule: allow
            port: '443'
            proto: tcp

        - name: Enable UFW firewall
          ufw:
            state: enabled
            policy: deny

    - name: Restart nginx before SSL
      systemd:
        name: nginx
        state: restarted

    - name: Test local nginx connectivity
      uri:
        url: "http://localhost"
        method: GET
        timeout: 5
      register: local_test
      ignore_errors: yes

    - name: Display local test result
      debug:
        msg: "Local nginx test: {{ local_test.status | default('failed') }}"

    - name: Obtain SSL certificate for Jenkins
      shell: certbot --nginx -d {{ domain_name }} --non-interactive --agree-tos -m {{ letsencrypt_email | default('testadmin@' + domain_name) }}
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem

    - name: Create HTTPS Nginx configuration for Jenkins
      template:
        src: ../../templates/nginx.jenkins.https.j2
        dest: "/etc/nginx/sites-available/{{ domain_name }}"
        backup: yes
      notify: restart nginx

    - name: Allow SSH access
      ufw:
        rule: allow
        port: '22'
      ignore_errors: yes

    - name: Allow HTTP traffic
      ufw:
        rule: allow
        port: '80'
      ignore_errors: yes

    - name: Allow HTTPS traffic
      ufw:
        rule: allow
        port: '443'
      ignore_errors: yes

    - name: Display deployment completion
      debug:
        msg: "Jenkins with Nginx deployed successfully on {{ ansible_host }}."

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted