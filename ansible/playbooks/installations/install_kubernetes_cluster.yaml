---
# Complete Kubernetes Cluster Setup
# This playbook sets up a complete K8s cluster with control plane and workers

- name: Setup Kubernetes Control Plane
  hosts: k8s_control_plane
  become: yes
  tasks:
    - name: Install Docker
      include_tasks: ../tasks/install_docker.yaml

    - name: Install Kubernetes components
      include_tasks: ../tasks/install_k8s_components.yaml

    - name: Initialize Kubernetes cluster
      shell: |
        kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address={{ ansible_host }}
      register: kubeadm_init
      when: not (kubeadm_init_done | default(false))

    - name: Save kubeadm join command
      set_fact:
        kubeadm_join_command: "{{ kubeadm_init.stdout_lines[-2:] | join(' ') }}"
      when: kubeadm_init.changed

    - name: Setup kubectl for azureuser
      shell: |
        mkdir -p /home/azureuser/.kube
        cp -i /etc/kubernetes/admin.conf /home/azureuser/.kube/config
        chown azureuser:azureuser /home/azureuser/.kube/config

    - name: Install Flannel CNI
      become_user: azureuser
      shell: |
        kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /home/azureuser/.kube/config

    - name: Install NGINX Ingress Controller
      become_user: azureuser
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
      environment:
        KUBECONFIG: /home/azureuser/.kube/config

    - name: Install Jenkins
      include_tasks: ../tasks/install_jenkins.yaml
      when: jenkins_enabled | default(false)

- name: Setup Kubernetes Worker Nodes
  hosts: k8s_workers
  become: yes
  tasks:
    - name: Install Docker
      include_tasks: ../tasks/install_docker.yaml

    - name: Install Kubernetes components
      include_tasks: ../tasks/install_k8s_components.yaml

    - name: Join worker nodes to cluster
      shell: "{{ hostvars[groups['k8s_control_plane'][0]]['kubeadm_join_command'] }}"
      when: hostvars[groups['k8s_control_plane'][0]]['kubeadm_join_command'] is defined

- name: Configure specialized services
  hosts: k8s_workers
  become: yes
  tasks:
    - name: Setup NGINX on prod VM
      include_tasks: ../tasks/setup_nginx_worker.yaml
      when: nginx_enabled | default(false)

    - name: Setup MinIO on minio VM
      include_tasks: ../tasks/setup_minio_worker.yaml
      when: minio_enabled | default(false)