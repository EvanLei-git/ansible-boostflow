---
- name: Install and configure Kubernetes
  hosts: all
  become: yes
  vars:
    pod_network_cidr: "10.244.0.0/16"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes apt key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
        state: present
        filename: kubernetes

    - name: Update apt cache after adding repository
      apt:
        update_cache: yes

    - name: Install containerd.io
      apt:
        name: containerd.io
        state: present

    - name: Install Kubernetes components
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Configure containerd to use systemd cgroup driver
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '            SystemdCgroup = false'
        line: '            SystemdCgroup = true'
        backup: yes

    - name: Enable CRI plugin in containerd
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^disabled_plugins.*cri.*'
        state: absent
        backup: yes

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Wait for containerd to be ready
      pause:
        seconds: 15

    - name: Load required kernel modules
      shell: |
        modprobe br_netfilter
        modprobe overlay
        echo 'br_netfilter' >> /etc/modules-load.d/k8s.conf
        echo 'overlay' >> /etc/modules-load.d/k8s.conf
      ignore_errors: yes

    - name: Configure sysctl for Kubernetes
      shell: |
        echo 'net.bridge.bridge-nf-call-iptables = 1' >> /etc/sysctl.d/k8s.conf
        echo 'net.bridge.bridge-nf-call-ip6tables = 1' >> /etc/sysctl.d/k8s.conf
        echo 'net.ipv4.ip_forward = 1' >> /etc/sysctl.d/k8s.conf
        sysctl --system
      ignore_errors: yes

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: yes

    - name: Reset any existing Kubernetes cluster
      command: kubeadm reset --force
      ignore_errors: yes

    - name: Remove existing kubeconfig
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/.kube/config
        - "/home/{{ ansible_user }}/.kube/config"
      ignore_errors: yes

    - name: Initialize Kubernetes cluster
      command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
        --ignore-preflight-errors=NumCPU,CRI,FileContent--proc-sys-net-bridge-bridge-nf-call-iptables
        --control-plane-endpoint={{ ansible_default_ipv4.address }}
        --apiserver-bind-port=6443
        --skip-phases=addon/coredns
        --v=5
      register: kubeadm_init
      changed_when: kubeadm_init.rc == 0
      failed_when: kubeadm_init.rc != 0 and "already exists" not in kubeadm_init.stderr
      timeout: 600

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copy admin.conf to .kube/config for root
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: '0644'

    - name: Create .kube directory for ansible user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy admin.conf to user .kube/config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Wait for Kubernetes API to be ready
      wait_for:
        port: 6443
        host: "{{ ansible_default_ipv4.address }}"
        timeout: 300

    - name: Install CoreDNS manually
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl create deployment coredns --image=registry.k8s.io/coredns/coredns:v1.10.1 -n kube-system --dry-run=client -o yaml | kubectl apply -f -
        kubectl expose deployment coredns --port=53 --target-port=53 --protocol=UDP --name=kube-dns -n kube-system --cluster-ip=10.96.0.10
        kubectl patch service kube-dns -n kube-system -p '{"spec":{"selector":{"app":"coredns"}}}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ignore_errors: yes
      timeout: 300

    - name: Wait for API server port
      wait_for:
        port: 6443
        host: "{{ ansible_default_ipv4.address }}"
        delay: 30
        timeout: 300

    - name: Install Flannel CNI
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      retries: 3
      delay: 10
      register: flannel_install
      until: flannel_install.rc == 0

    - name: Wait for all nodes to be ready
      command: kubectl get nodes --no-headers
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: nodes_status
      until: "'Ready' in nodes_status.stdout"
      retries: 20
      delay: 15
      ignore_errors: yes

    - name: Display cluster status
      command: kubectl get nodes
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: cluster_status
      ignore_errors: yes

    - name: Show cluster info
      debug:
        msg: "{{ cluster_status.stdout_lines }}"
      when: cluster_status.stdout is defined