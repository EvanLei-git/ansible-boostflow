---
# Install Jenkins on control plane
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Java (required for Jenkins)
  apt:
    name: openjdk-17-jdk
    state: present

- name: Add Jenkins GPG key
  shell: |
    curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key | sudo tee /usr/share/keyrings/jenkins-keyring.asc > /dev/null
  args:
    creates: /usr/share/keyrings/jenkins-keyring.asc

- name: Add Jenkins repository
  lineinfile:
    path: /etc/apt/sources.list.d/jenkins.list
    line: 'deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/'
    create: yes

- name: Update apt cache after adding Jenkins repo
  apt:
    update_cache: yes

- name: Install Jenkins
  apt:
    name: jenkins
    state: present

- name: Add jenkins user to docker group (if docker is installed)
  user:
    name: jenkins
    groups: docker
    append: yes
  ignore_errors: yes

- name: Start and enable Jenkins
  systemd:
    name: jenkins
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for Jenkins to be ready
  wait_for:
    port: 8080
    host: localhost
    delay: 30
    timeout: 180

- name: Install Ansible for Jenkins
  apt:
    name: ansible
    state: present

- name: Create Jenkins .ssh directory
  file:
    path: /var/lib/jenkins/.ssh
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0700'

- name: Copy SSH keys for Jenkins
  copy:
    src: "/home/azureuser/.ssh/{{ item }}"
    dest: "/var/lib/jenkins/.ssh/{{ item }}"
    owner: jenkins
    group: jenkins
    mode: '0600'
    remote_src: yes
  loop:
    - id_boostflow
    - id_boostflow.pub
    - known_hosts

- name: Get Jenkins initial admin password
  slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_password_file
  ignore_errors: yes

- name: Display Jenkins initial password
  debug:
    msg: "Jenkins initial admin password: {{ jenkins_password_file.content | b64decode | trim if jenkins_password_file.content is defined else 'Check /var/lib/jenkins/secrets/initialAdminPassword' }}"