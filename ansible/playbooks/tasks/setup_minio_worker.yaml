---
# Setup MinIO on worker node
- name: Create MinIO user
  user:
    name: minio
    system: yes
    shell: /bin/false
    home: /opt/minio
    create_home: yes

- name: Create MinIO data directory
  file:
    path: /opt/minio/data
    state: directory
    owner: minio
    group: minio
    mode: '0755'

- name: Create MinIO config directory
  file:
    path: /etc/minio
    state: directory
    owner: minio
    group: minio
    mode: '0755'

- name: Download MinIO binary
  get_url:
    url: https://dl.min.io/server/minio/release/linux-amd64/minio
    dest: /usr/local/bin/minio
    mode: '0755'
    owner: root
    group: root

- name: Create MinIO configuration file
  copy:
    content: |
      MINIO_ROOT_USER=minioadmin
      MINIO_ROOT_PASSWORD=minioadmin123
      MINIO_VOLUMES=/opt/minio/data
      MINIO_OPTS="--console-address :9001"
    dest: /etc/minio/minio.conf
    owner: minio
    group: minio
    mode: '0640'

- name: Create MinIO systemd service
  copy:
    content: |
      [Unit]
      Description=MinIO
      Documentation=https://docs.min.io
      Wants=network-online.target
      After=network-online.target
      AssertFileIsExecutable=/usr/local/bin/minio
      
      [Service]
      WorkingDirectory=/opt/minio
      
      User=minio
      Group=minio
      ProtectProc=invisible
      
      EnvironmentFile=/etc/minio/minio.conf
      ExecStartPre=/bin/bash -c "if [ -z \"${MINIO_VOLUMES}\" ]; then echo \"Variable MINIO_VOLUMES not set in /etc/minio/minio.conf\"; exit 1; fi"
      ExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
      
      # Let systemd restart this service always
      Restart=always
      
      # Specifies the maximum file descriptor number that can be opened by this process
      LimitNOFILE=65536
      
      # Specifies the maximum number of threads this process can create
      TasksMax=infinity
      
      # Disable timeout logic and wait until process is stopped
      TimeoutStopSec=infinity
      SendSIGKILL=no
      
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Start and enable MinIO service
  systemd:
    name: minio
    state: started
    enabled: yes

- name: Open firewall for MinIO API
  ufw:
    rule: allow
    port: '9000'
    proto: tcp

- name: Open firewall for MinIO Console
  ufw:
    rule: allow
    port: '9001'
    proto: tcp

- name: Display MinIO access information
  debug:
    msg: |
      MinIO is now running!
      API Endpoint: http://{{ ansible_host }}:9000
      Console: http://{{ ansible_host }}:9001
      Access Key: minioadmin
      Secret Key: minioadmin123