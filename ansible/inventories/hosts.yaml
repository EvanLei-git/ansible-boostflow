---
all:
  children:
    # Jenkins + Ansible Controller (VM1)
    control_vm:
      hosts:
        vag-setup-vm:
          ansible_host: 20.91.227.216
          ansible_user: azureuser
          ansible_ssh_private_key_file: ~/.ssh/id_boostflow
          jenkins_enabled: true
          ansible_controller: true

    # Application Servers (VM2 & VM3)
    app_servers:
      hosts:
        vag-prod-vm:
          ansible_host: 4.223.113.211
          ansible_user: azureuser
          ansible_ssh_private_key_file: ~/.ssh/id_boostflow
          nginx_enabled: true
          nextjs_enabled: true
        vag-minio-vm:
          ansible_host: 4.223.116.59
          ansible_user: azureuser
          ansible_ssh_private_key_file: ~/.ssh/id_boostflow
          minio_enabled: true

    # All VMs grouping
    azure_hosts:
      children:
        control_vm:
        app_servers:
      
